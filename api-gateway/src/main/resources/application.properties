spring.application.name=api-gateway

# ==========================================
# Gateway Server
# ==========================================
server.port=8082

# ==========================================
# Product Service Route
# ==========================================
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/products/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=productCircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/product-service

# ==========================================
# Order Service Route
# ==========================================
spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=orderCircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/order-service

# ==========================================
# Actuator
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,gateway,prometheus
management.endpoint.health.show-details=always
management.endpoint.gateway.access=read-only

# ==========================================
# Resilience4j - Product Circuit Breaker
# ==========================================
resilience4j.circuitbreaker.instances.productCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.productCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.productCircuitBreaker.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.productCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.productCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.productCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true

# ==========================================
# Resilience4j - Order Circuit Breaker
# ==========================================
resilience4j.circuitbreaker.instances.orderCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.orderCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderCircuitBreaker.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.orderCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.orderCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.orderCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true


