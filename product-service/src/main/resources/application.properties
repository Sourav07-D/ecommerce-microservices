spring.application.name=product-service

# Application port
server.port=${PRODUCT_SERVICE_PORT:8080}

# PostgreSQL connection
spring.datasource.url=${PRODUCT_DB_URL:jdbc:postgresql://localhost:5433/product_db}
spring.datasource.username=${PRODUCT_DB_USER}
spring.datasource.password=${PRODUCT_DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true