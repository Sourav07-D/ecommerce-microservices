spring.application.name=order-service

# Application port
server.port=${ORDER_SERVICE_PORT:8081}


# PostgreSQL connection
spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5434/order_db}
spring.datasource.username=${ORDER_DB_USER}
spring.datasource.password=${ORDER_DB_PASSWORD}


# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


# Flyway migrations
spring.flyway.enabled=true


# Product Service connection
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8080}

# Payment Service connection
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8083}


# ==========================================
# RESILIENCE4J CIRCUIT BREAKER
# ==========================================

# Sliding window configuration
resilience4j.circuitbreaker.instances.productService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=10

# Failure threshold
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50

# Open state configuration
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=30s

# Half-open configuration
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.productService.automatic-transition-from-open-to-half-open-enabled=true

# Slow call detection
resilience4j.circuitbreaker.instances.productService.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.productService.slow-call-rate-threshold=50

# Ignore exceptions that should not affect Circuit Breaker metrics
resilience4j.circuitbreaker.instances.productService.ignore-exceptions=io.github.resilience4j.bulkhead.BulkheadFullException,com.example.order_service.exception.ProductNotFoundException


# ==========================================
# RESILIENCE4J RETRY
# ==========================================

# Maximum attempts include the initial request
resilience4j.retry.instances.productService.max-attempts=3
resilience4j.retry.instances.productService.wait-duration=1s

# Retry only temporary Product Service failures
resilience4j.retry.instances.productService.retry-exceptions=com.example.order_service.exception.ProductServiceUnavailableException

# Never retry these exceptions
resilience4j.retry.instances.productService.ignore-exceptions=io.github.resilience4j.bulkhead.BulkheadFullException,com.example.order_service.exception.ProductNotFoundException


# ==========================================
# RESILIENCE4J BULKHEAD
# ==========================================

# Maximum concurrent calls to Product Service
resilience4j.bulkhead.instances.productService.max-concurrent-calls=5

# Reject immediately if all permits are occupied
resilience4j.bulkhead.instances.productService.max-wait-duration=0


# ==========================================
# ACTUATOR
# ==========================================


management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads,bulkheadevents
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true


logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


