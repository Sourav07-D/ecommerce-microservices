spring.application.name=payment-service

# Server
server.port=${PAYMENT_SERVICE_PORT:8083}

# PostgreSQL Database
spring.datasource.url=${PAYMENT_DB_URL:jdbc:postgresql://localhost:5435/payment_db}
spring.datasource.username=${PAYMENT_DB_USER}
spring.datasource.password=${PAYMENT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Payment recovery configuration
payment.recovery.stale-threshold-minutes=5
payment.recovery.fixed-delay-ms=60000

# Automatic recovery remains disabled until a real provider lookup is integrated
payment.recovery.enabled=false