spring.application.name=payment-service-test

# Isolated Test Database
spring.datasource.url=jdbc:postgresql://localhost:5435/payment_test_db
spring.datasource.username=payment_user
spring.datasource.password=${PAYMENT_TEST_DB_PASSWORD:payment_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Server
server.port=0
